name: Verify metadata service
on:
  push:
  pull_request:
jobs:
  java-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/db-metadata-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run unit tests (no Oracle connection required)
        run: mvn -B clean verify
